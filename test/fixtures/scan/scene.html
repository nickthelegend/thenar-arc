<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const P = new URLSearchParams(location.search);
const A = (x, y, z) => new THREE.Vector3(x, z, -y);
const W = 1600, H = 1200;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#8a8680");
scene.add(new THREE.HemisphereLight("#ffffff", "#444444", 1.3));
const sun = new THREE.DirectionalLight("#fff6e8", 2.2); sun.position.copy(A(0.1, 0.6, 1.2)); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1 }); scene.add(sun);
const table = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshStandardMaterial({ color: "#6b4a2f", roughness: 0.8 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);
const sheet = new THREE.Mesh(new THREE.PlaneGeometry(0.297, 0.210), new THREE.MeshStandardMaterial({ color: "#f4f4ef", roughness: 0.9 }));
sheet.rotation.x = -Math.PI / 2; sheet.position.copy(A(0.09 + 0.1485, 0, 0.0005)); sheet.receiveShadow = true; scene.add(sheet);
const two = P.get("v") === "2";
const cam = new THREE.PerspectiveCamera(50, W / H, 0.01, 10);
if (two) { cam.position.copy(A(-0.18, 0.34, 0.36)); cam.lookAt(A(0.28, -0.04, 0)); } else { cam.position.copy(A(-0.32, 0.0, 0.52)); cam.lookAt(A(0.30, 0, 0)); }
cam.updateMatrixWorld(); cam.updateProjectionMatrix();
const truth = two ? { pick: [0.26, -0.06], place: [0.16, 0.12] } : { pick: [0.20, 0.10], place: [0.33, -0.09] };
const loader = new GLTFLoader();
async function put(url, at) { const g = await loader.loadAsync(url); const m = g.scene; m.rotation.x = -Math.PI / 2; m.position.copy(A(at[0], at[1], 0)); m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); scene.add(m); }
await put("/props/apple.glb", truth.pick); await put("/props/bowl.glb", truth.place);
r.render(scene, cam);
const px = (v) => { const p = v.clone().project(cam); return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H }; };
window.RESULT = { png: r.domElement.toDataURL("image/png"), corners: [A(0.09, 0.105, 0), A(0.09, -0.105, 0), A(0.387, -0.105, 0), A(0.387, 0.105, 0)].map(px), base: { pick: px(A(truth.pick[0], truth.pick[1], 0)), place: px(A(truth.place[0], truth.place[1], 0)) }, truth, size: [W, H] };
</script></body></html>
