name: verify

# The checks that were being typed out by hand after every deploy. Running them
# on a schedule matters as much as on a push: the invariant that broke in this
# project — the ledger drifting from the contract's own count — drifts on its
# own, without anyone committing anything.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint app components lib
      - run: npm run build
      # Every model has to be a real glTF 2.0 binary, and big enough on screen
      # to see — this project shipped props at 0.1 x 0.1 pixels once.
      - run: node scripts/projected-size.mjs

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # The contracts hold the escrow and decide the payouts, and until now the
      # only thing running their tests was whoever remembered to.
      - run: forge test
        working-directory: contracts
      # Gas is a regression surface like any other: a change that quietly
      # doubles the cost of submitTrajectory is a change that quietly doubles
      # what an operator pays to be paid. The snapshot is committed, so this
      # fails until somebody re-snapshots on purpose. One percent of tolerance,
      # because solc is not bit-identical across patch versions and a build
      # that fails for that reason teaches people to ignore it.
      - run: forge snapshot --check --tolerance 1
        working-directory: contracts
      - run: forge lint
        working-directory: contracts

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Read-only against the deployed system, which is the only place the
      # frontend, the API, the database and the chain are assembled together.
      - run: node test/e2e.mjs
        env:
          BASE: https://thenar.io

      # The itemised plan in docs/TESTPLAN.md, which until now only ran when
      # somebody remembered to type it. The API and chain runners need no
      # browser; the page ones drive a real Chromium and check the console and
      # network panel on every item, which is the half a fetch cannot do.
      - run: npm ci --no-audit --no-fund
      - run: node scripts/qa-api.mjs https://thenar.io
      - run: node scripts/qa-chain.mjs
      - run: node scripts/qa-post.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-pages.mjs https://thenar.io
      - run: node scripts/qa-contracts.mjs https://thenar.io
      - run: node scripts/qa-deep.mjs
      - run: node scripts/qa-matrix.mjs https://thenar.io
